[package]
name = "barber-manager"
version = "0.1.0"
description = "理发店会员管理系统"
authors = ["a1"]
edition = "2021"

[lib]
name = "barber_manager"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "barber-manager"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.31"
csv = "1.3"
calamine = "0.24"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
overflow-checks = true
liftime-dtorck = true
